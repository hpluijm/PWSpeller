# ── Over dit bestand ──────────────────────────────────────
# Doel:           Bouwt bij een tag v* PWSpeller voor Windows, macOS en Linux en zet de bestanden en releasenotes bij een GitHub-release.
# Klant:          Petisys
# Gemaakt vanuit: Petisys
# Bron:           https://github.com/hpluijm/PWSpeller, release v2.0.0
# Copyright: onderaan dit bestand. Overige rechthebbenden: NOTICE.md.
#
# 2026-10-17  Hans van der Pluijm (Petisys)  [Claude Code]
#   Eindreview: Linux bouwt op ubuntu-22.04 (oudere glibc); de tag moet gelijk zijn aan de versie in Cargo.toml.
#
# 2026-10-17  Hans van der Pluijm (Petisys)  [Claude Code]
#   Taak 18 fixronde: tag valideren, eerst controle (fmt, clippy, tests, cargo deny), geen expressies in run, exacte releasenotes.
#
# 2026-10-17  Hans van der Pluijm (Petisys)  [Claude Code]
#   Taak 18: workflow aangemaakt.
# ──────────────────────────────────────────────────────────

# Actions staan vastgepind op de commit-SHA van een major-versie (de tag in de opmerking). De
# release gebeurt met `gh`, dat op de runner staat; daar is geen actie van een derde partij voor nodig.
name: Release

on:
  push:
    tags: ["v*"]

# Schrijfrechten alleen in de job die de release maakt.
permissions:
  contents: read

# Expressies als `github.ref_name` en `matrix.*` komen nooit rechtstreeks in een `run:`-script,
# maar via `env:` als gewone omgevingsvariabele; zo kan een tagnaam geen shellcode worden.
env:
  CARGO_TERM_COLOR: always
  PWSPELLER_VERSIE: ${{ github.ref_name }}
  TAG: ${{ github.ref_name }}

jobs:
  tag:
    name: Tag en releasenotes controleren
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Tag valideren
        id: tag
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Ongeldige tag '$TAG'; verwacht vX.Y.Z of vX.Y.Z-achtervoegsel."
            exit 1
          fi
          # Een tag met een achtervoegsel (bv. v2.0.0-rc1) wordt een prerelease.
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag vergelijken met de versie in Cargo.toml
        shell: bash
        run: |
          # De versie van de werkruimte; de tag zonder v en zonder achtervoegsel moet gelijk zijn.
          cargo_versie="$(awk '/^\[workspace\.package\]/ { s = 1; next } /^\[/ { s = 0 } s && /^version[[:space:]]*=/ { gsub(/[" ]/, ""); sub(/^version=/, ""); print; exit }' Cargo.toml)"
          tag_versie="${TAG#v}"
          tag_versie="${tag_versie%%-*}"
          if [ -z "$cargo_versie" ]; then
            echo "::error::Geen version gevonden onder [workspace.package] in Cargo.toml."
            exit 1
          fi
          if [ "$tag_versie" != "$cargo_versie" ]; then
            echo "::error::Tag $TAG hoort bij versie $tag_versie, maar Cargo.toml heeft version $cargo_versie. Pas de version aan of kies een andere tag."
            exit 1
          fi
      - name: Releasenotes van deze versie ophalen
        shell: bash
        run: packaging/releasenotes.sh "$TAG" RELEASENOTES.md > notities.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notities
          path: notities.md
          if-no-files-found: error

  controle:
    name: Controle ${{ matrix.os }}
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust installeren
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Pakketten voor eframe (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: Opmaak
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # In de release is cargo deny volledig blokkerend, ook de beveiligingsberichten (advisories).
  deny:
    name: cargo deny
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check

  windows:
    name: Windows ${{ matrix.naam }}
    needs: [controle, deny]
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { naam: x64, doel: x86_64-pc-windows-msvc }
          - { naam: arm64, doel: aarch64-pc-windows-msvc }
    env:
      DOEL: ${{ matrix.doel }}
      NAAM: ${{ matrix.naam }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust installeren
        shell: bash
        run: rustup toolchain install stable --profile minimal --target "$DOEL"
      - name: Bouwen
        shell: bash
        run: cargo build --release -p pwspeller --target "$DOEL"
      - name: Controle - geen losse C-runtime nodig
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe niet gevonden' }
          $exe = Join-Path 'target' (Join-Path $env:DOEL 'release\pwspeller.exe')
          $uitvoer = & $dumpbin /dependents $exe | Out-String
          Write-Host $uitvoer
          if ($uitvoer -match 'VCRUNTIME') { throw 'Het programma heeft VCRUNTIME nodig; crt-static werkt niet.' }
      - name: Naam geven
        shell: bash
        run: |
          mkdir uit
          cp "target/$DOEL/release/pwspeller.exe" "uit/PWSpeller-$TAG-windows-$NAAM.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-${{ matrix.naam }}
          path: uit/*
          if-no-files-found: error

  macos:
    name: macOS universeel
    needs: [controle, deny]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust installeren
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Bouwen (arm64 en x86_64)
        run: |
          cargo build --release -p pwspeller --target aarch64-apple-darwin
          cargo build --release -p pwspeller --target x86_64-apple-darwin
      - name: Samenvoegen en bundel maken
        run: |
          mkdir -p uit bouw
          lipo -create -output bouw/pwspeller \
            target/aarch64-apple-darwin/release/pwspeller \
            target/x86_64-apple-darwin/release/pwspeller
          lipo -info bouw/pwspeller
          packaging/macos/maak-app.sh bouw/pwspeller "$TAG" bouw
          codesign -d --entitlements - bouw/PWSpeller.app
          ditto -c -k --keepParent bouw/PWSpeller.app "uit/PWSpeller-$TAG-macos.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos
          path: uit/*
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: [controle, deny]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust installeren
        run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-gnu
      - name: Pakketten voor eframe
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: Bouwen
        run: |
          cargo build --release -p pwspeller --target x86_64-unknown-linux-gnu
          mkdir uit
          cp target/x86_64-unknown-linux-gnu/release/pwspeller "uit/pwspeller-$TAG-linux-x64"
          chmod 755 uit/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: uit/*
          if-no-files-found: error

  release:
    name: GitHub-release
    needs: [tag, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PRERELEASE: ${{ needs.tag.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: uit
          merge-multiple: true
      - name: Release maken
        shell: bash
        run: |
          mv uit/notities.md notities.md
          ls -l uit
          extra=()
          if [[ "$PRERELEASE" == "true" ]]; then extra+=(--prerelease); fi
          gh release create "$TAG" uit/* \
            --title "PWSpeller $TAG" \
            --notes-file notities.md \
            --verify-tag \
            "${extra[@]}"

