[meta]
code = "fr"

[sjablonen]
hoofdletter = "majuscule {woord}"
kleine_letter = "minuscule {woord}"
cijfer = "chiffre {naam}"
woord = "{woord}"
woord_met_hoofdletter = "{woord}, avec une majuscule"
onbekend = "caractère {teken} ({code})"

[cijfers]
"0" = "zéro"
"1" = "un"
"2" = "deux"
"3" = "trois"
"4" = "quatre"
"5" = "cinq"
"6" = "six"
"7" = "sept"
"8" = "huit"
"9" = "neuf"

[tekens]
" " = "espace"
"!" = "point d'exclamation"
"\"" = "guillemet double"
"#" = "dièse"
"$" = "dollar"
"%" = "pour cent"
"&" = "esperluette"
"'" = "apostrophe"
"(" = "parenthèse ouvrante"
")" = "parenthèse fermante"
"*" = "astérisque"
"+" = "plus"
"," = "virgule"
"-" = "tiret"
"." = "point"
"/" = "barre oblique"
":" = "deux-points"
";" = "point-virgule"
"<" = "inférieur à"
"=" = "égal"
">" = "supérieur à"
"?" = "point d'interrogation"
"@" = "arobase"
"[" = "crochet ouvrant"
"\\" = "antislash"
"]" = "crochet fermant"
"^" = "accent circonflexe"
"_" = "tiret bas"
"`" = "accent grave"
"{" = "accolade ouvrante"
"|" = "barre verticale"
"}" = "accolade fermante"
"~" = "tilde"

[lastige_klanken]
bevat = []
eindigt_op = []

