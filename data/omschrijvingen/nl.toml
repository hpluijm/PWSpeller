[meta]
code = "nl"

[sjablonen]
hoofdletter = "hoofdletter {woord}"
kleine_letter = "kleine letter {woord}"
cijfer = "cijfer {naam}"
woord = "{woord}"
woord_met_hoofdletter = "{woord}, met hoofdletter"
onbekend = "teken {teken} ({code})"

[cijfers]
"0" = "nul"
"1" = "een"
"2" = "twee"
"3" = "drie"
"4" = "vier"
"5" = "vijf"
"6" = "zes"
"7" = "zeven"
"8" = "acht"
"9" = "negen"

[tekens]
" " = "spatie"
"!" = "uitroepteken"
"\"" = "dubbel aanhalingsteken"
"#" = "hekje"
"$" = "dollarteken"
"%" = "procentteken"
"&" = "ampersand"
"'" = "enkel aanhalingsteken"
"(" = "haakje openen"
")" = "haakje sluiten"
"*" = "sterretje"
"+" = "plusteken"
"," = "komma"
"-" = "streepje"
"." = "punt"
"/" = "schuine streep"
":" = "dubbele punt"
";" = "puntkomma"
"<" = "kleiner dan"
"=" = "is gelijk aan"
">" = "groter dan"
"?" = "vraagteken"
"@" = "apenstaartje"
"[" = "blokhaak openen"
"\\" = "backslash"
"]" = "blokhaak sluiten"
"^" = "dakje"
"_" = "laag streepje"
"`" = "accent grave"
"{" = "accolade openen"
"|" = "verticale streep"
"}" = "accolade sluiten"
"~" = "tilde"

[lastige_klanken]
bevat = ["ij", "ei", "au", "ou"]
eindigt_op = ["d", "t"]

