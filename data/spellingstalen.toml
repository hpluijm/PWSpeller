#   Spellingstalen nl, vl, fr, de, en en navo aangemaakt (Taak 5).
# ──────────────────────────────────────────────────────────

[[taal]]
code = "nl"
naam = "Nederlands"
alfabet = "nl"
omschrijvingen = "nl"
woordenlijst = "nl"

[[taal]]
code = "vl"
naam = "Vlaams"
alfabet = "vl"
omschrijvingen = "nl"
woordenlijst = "nl"

[[taal]]
code = "fr"
naam = "Français"
alfabet = "fr"
omschrijvingen = "fr"
woordenlijst = "fr"

[[taal]]
code = "de"
naam = "Deutsch"
alfabet = "de"
omschrijvingen = "de"
woordenlijst = "de"

[[taal]]
code = "en"
naam = "English"
alfabet = "navo"
omschrijvingen = "en"
woordenlijst = "en-eff"

# NAVO gebruikt de taal van de interface: geen omschrijvingen.
[[taal]]
code = "navo"
naam = "NATO / NAVO"
alfabet = "navo"
woordenlijst = "en-eff"

