[package]
name = "pwspeller"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pwspeller-kern = { path = "../kern", features = ["serde"] }
pwspeller-data = { path = "../data" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "accesskit", "wayland", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
directories = "6.0.0"
sys-locale = "0.3.2"
log = "0.4.34"

