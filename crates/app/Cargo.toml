[package]
name = "pwspeller"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pwspeller-kern = { path = "../kern", features = ["serde"] }
pwspeller-data = { path = "../data" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "accesskit", "clipboard", "wayland", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
directories = "6.0.0"
sys-locale = "0.3.2"
log = "0.4.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
zeroize = "1.9.1"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
sha2 = "0.11.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
egui_kittest = "0.37.0"

[build-dependencies]
winresource = "0.1.34"

