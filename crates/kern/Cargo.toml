[package]
name = "pwspeller-kern"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pwspeller-data = { version = "2.0.0", path = "../data" }
rand = { version = "0.10.3", features = ["unbiased"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
zeroize = "1.9.1"

[build-dependencies]
pwspeller-data = { version = "2.0.0", path = "../data" }

[features]
serde = ["dep:serde"]

